name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ffmpeg_url: https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.3-6/jellyfin-ffmpeg_7.1.3-6_portable_linux64-gpl.tar.xz
            ffmpeg_ext: tar.xz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg_url: https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.3-6/jellyfin-ffmpeg_7.1.3-6_portable_win64-clang-gpl.zip
            ffmpeg_ext: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ffmpeg_url: https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.3-6/jellyfin-ffmpeg_7.1.3-6_portable_mac64-gpl.tar.xz
            ffmpeg_ext: tar.xz
          - os: macos-latest
            target: aarch64-apple-darwin
            ffmpeg_url: https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v7.1.3-6/jellyfin-ffmpeg_7.1.3-6_portable_macarm64-gpl.tar.xz
            ffmpeg_ext: tar.xz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - name: setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download FFmpeg sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -L "${{ matrix.ffmpeg_url }}" -o ffmpeg_archive.${{ matrix.ffmpeg_ext }}

          if [[ "${{ matrix.ffmpeg_ext }}" == "zip" ]]; then
            unzip ffmpeg_archive.zip -d ffmpeg_out
          else
            mkdir ffmpeg_out
            tar -xf ffmpeg_archive.tar.xz -C ffmpeg_out
          fi

          FFMPEG_BIN=$(find ffmpeg_out -type f \( -name "ffmpeg" -o -name "ffmpeg.exe" \))
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv "$FFMPEG_BIN" src-tauri/bin/ffmpeg-${{ matrix.target }}.exe
          else
            mv "$FFMPEG_BIN" src-tauri/bin/ffmpeg-${{ matrix.target }}
            chmod +x src-tauri/bin/ffmpeg-${{ matrix.target }}
          fi

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DiscoMod v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
